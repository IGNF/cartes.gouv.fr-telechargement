server {
    listen       8080;
    server_name  localhost;
    root /usr/share/nginx/html;

    # Redirection pour ajouter un slash final si nécessaire
    location = /telechargement {
        return 301 /telechargement/;
    }

    location /telechargement/ {
        try_files $uri $uri/ /telechargement/index.html;
    }

    # Une configuration absente ne doit pas être remplacée par la page SPA.
    location ^~ /telechargement/config/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /telechargement/silent-renew.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /telechargement/silent-renew.js {
        try_files $uri =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
    location / {
        return 404;
    }
}